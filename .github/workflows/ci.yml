  upstream-v2-browser-patch:
    name: Upstream V2 browser capability patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch exact official V2 source and verify patch
        shell: bash
        run: |
          node scripts/check-g119-cross-stream.mjs
          git init "$RUNNER_TEMP/opencode-v2"
          git -C "$RUNNER_TEMP/opencode-v2" fetch --depth=1 https://github.com/anomalyco/opencode.git 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/opencode-v2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/opencode-v2" rev-parse HEAD)" = 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/opencode-v2" apply --check "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
          git -C "$RUNNER_TEMP/opencode-v2" apply "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install upstream dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ runner.temp }}/opencode-v2
      - name: G141 G137 exact G131 document finality + G126 provenance + G106 policy and one-shot native broker
        working-directory: ${{ runner.temp }}/opencode-v2
        run: |
          bun run --cwd packages/plugin typecheck
          bun run --cwd packages/plugin-browser typecheck
          bun run --cwd packages/core typecheck
          bun run --cwd packages/gui-extensions typecheck
          (cd packages/core && bun test test/permission.test.ts test/permission-browser-lease.test.ts test/plugin/browser-lease.test.ts test/plugin/browser-one-shot.test.ts test/plugin/browser-capability.test.ts test/plugin/browser-rpc-provenance.test.ts)
          (cd packages/plugin-browser && bun test test/read-commit.test.ts test/first-attach-authority.test.ts test/connection-location.test.ts test/attach-ownership.test.ts test/tunnel-provenance.test.ts)
          (cd packages/gui-extensions && bun test src/browser/read-commit-gate.test.ts)
