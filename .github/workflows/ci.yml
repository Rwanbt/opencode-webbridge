      - name: G141 exact G131 native patch and bounded G125 persisted completion guard
        run: node scripts/check-g119-cross-stream.mjs && node --test scripts/test-g125-persisted-session.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @opencode/cli@2.0.32
      - name: Install isolated headless Chromium for localhost only
        run: npx playwright install --with-deps --only-shell chromium
      - name: RED→GREEN G130 encrypted host-sink lost ACK and wrong scope
        run: npm run build && node --test scripts/test-g130-receipt-host.mjs
      - name: Real installed CLI single-tarball DOM/RPC/SSE and durable receipts after restart
        run: npm run smoke:g130-native

  g149-official-v2032-integrated-readonly-turn:
    name: G149 actual CLI 2.0.32 model session to Chromium/RPC/SSE and host read-only tool before ACK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @opencode/cli@2.0.32
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Denied host permission and forged official session fail before file reads
        run: npm run build && node --test scripts/test-g149-vertical-host.mjs
      - name: Actual official same-turn model Chromium DOM RPC host fsync tool and SSE
        run: npm run smoke:g149-vertical

  windows-progressive-relay:
    name: Windows bounded RPC progress (no Chromium)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Native protocol and fail-closed deltas, no browser or account
        run: node --test dist/test/browser-exchange.test.js dist/test/rpc-relay-port.test.js dist/test/rpc-browser-port.test.js dist/test/fixture-inference.test.js
      - name: G127/G128 encrypted read sink and immutable frame regression (no Chromium)
        run: node --test dist/test/durable-read-ack-sink.test.js dist/test/checkpointed-read-observer.test.js
      - name: G133 reject hostile tool proposal getters, extras and mutable authority (no browser)
        run: node --test dist/test/tool-proposal.test.js dist/test/tool-flow.test.js dist/test/workspace-path.test.js
      - name: G136 prevent concurrent double-effect and uncertain replay (fixture authority only)
        run: node --test dist/test/effect-broker.test.js dist/test/tool-broker.test.js
      - name: G140 durable anti-replay fence restart/rollback/lock (local temp files only)
        run: node --test dist/test/durable-operation-fence.test.js
      - name: G145 serialized read-only fixture refuses non-Linux file execution
        run: node --test dist/test/offline-tool-turn-orchestrator.test.js
      - name: G152 independent personal provider opt-in, verified capabilities, source isolation
        run: node --test dist/test/personal-provider-activation.test.js dist/test/provider-policy.test.js dist/test/adapter-contract.test.js
      - name: G156 origin attach and hostile read-only snapshot (Windows no Chromium)
        run: node --test dist/test/g156-chatgpt-dom.test.js
      - name: G157 explicit CDP composition refuses missing consent (Windows no Chromium)
        run: node --test dist/test/g157-chatgpt-cdp-observer.test.js
      - name: G160 other providers lack silent origin, tab or reading opt-in (Windows no Chromium)
        run: node --test dist/test/g160-other-provider-dom.test.js
      - name: G161 same-target same-URL document epoch anti-reload gate (Windows no Chromium)
        run: node --test dist/test/g161-document-epoch.test.js
      - name: G141 G135 Windows file-read closed + untrusted proposals (no Windows Git sandbox claim)
        run: node --test '--test-name-pattern=file.read opens real regular Linux inode|malformed provenance/unknown or mutable actions' dist/test/offline-readonly-tool-executor.test.js
      - name: G141 G138 bounded JSON hostile input and G139 authority snapshots
        run: node --test dist/test/tool-proposal-json-ingress.test.js dist/test/authority-context.test.js dist/test/effect-broker.test.js
      - name: G141 G142 nonresettable rate quota leases under clock/adversarial cancellation
        run: node --test dist/test/rate-limiter.test.js
      - name: G143 actual inert root artifact pack integrity (no official app)
        run: npm run smoke:actual-package
      - name: G150 default-off real root and localhost-only rejected opt-in
        run: node --test dist/test/g150-root-local-gate.test.js dist/test/distributed-entrypoint-package.test.js

