name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:backlog
      - run: npm run check:progress
      - run: npm run check:policy
      - run: npm run check:compat
      - run: npm run check:acceptance
      - name: G119 prove exact G106 full patch and G113 standalone browser fixture on one SHA
        run: npm run check:g119
      - run: npm test
      - name: Deterministic offline package, upgrade, rollback and uninstall
        run: npm run preview:package
      - name: Packaged RPC fixture offline upgrade, tamper denial and rollback
        run: npm run preview:rpc-package
      - name: G97 combined standalone RPC and model package offline lifecycle
        run: npm run preview:g97

  native-fixture-smoke:
    name: Native fixture smoke (OpenCode 2.0.29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install exact OpenCode CLI for isolated smoke
        run: npm install --no-save --no-package-lock --no-audit --no-fund @opencode/cli@2.0.29
      - name: G119 refuse downgraded G106 patch or modified G113 local model before Chromium
        run: npm run check:g119
      - name: Verify offline package installed in disposable OpenCode profile
        run: npm run smoke:package-native
      - name: Native CLI packaged RPC authority, upgrade and rollback (no Chromium)
        run: npm run smoke:rpc-package-native
      - name: G88 installed RPC through official CLI model turn and progressive fake SSE
        run: npm run smoke:packaged-model
      - name: G97 ONLY one installed tarball registers BOTH native RPC and model
        run: npm run smoke:g97-native
      - run: npm run smoke:native
      - run: npm run smoke:browser
      - run: npm run smoke:rpc
      - run: npm run smoke:e2e
      - name: Install isolated headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: G99/G100 installed plugin local Chromium DOM and fail-closed tab-change
        run: npm run smoke:g99-page
      - name: G113 installed plugin local Chromium actual page close is terminal uncertain
        run: npm run smoke:g99-page
        env:
          WEBBRIDGE_G113_PAGE_CLOSE: '1'
      - name: G119 replay EXACT G106 official V2 patch in same native G113 Chromium CI job
        shell: bash
        run: |
          node scripts/check-g119-cross-stream.mjs
          git init "$RUNNER_TEMP/g119-combined-v2"
          git -C "$RUNNER_TEMP/g119-combined-v2" fetch --depth=1 https://github.com/anomalyco/opencode.git 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/g119-combined-v2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/g119-combined-v2" rev-parse HEAD)" = 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/g119-combined-v2" apply --check "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
          git -C "$RUNNER_TEMP/g119-combined-v2" apply "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
          grep -F 'browserPolicy?.()' "$RUNNER_TEMP/g119-combined-v2/packages/core/src/plugin/browser.ts"
          grep -F 'readonly browserPolicy?:' "$RUNNER_TEMP/g119-combined-v2/packages/core/src/permission.ts"
      - run: npm run smoke:local-read
      - name: Offline DOM progressive relay and uncertain interruption
        run: npm run smoke:dom-rpc
      - run: npm run smoke:page

  windows-progressive-relay:
    name: Windows bounded RPC progress (no Chromium)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Native protocol and fail-closed deltas, no browser or account
        run: node --test dist/test/browser-exchange.test.js dist/test/rpc-relay-port.test.js dist/test/rpc-browser-port.test.js dist/test/fixture-inference.test.js

  upstream-v2-browser-patch:
    name: Upstream V2 browser capability patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch exact official V2 source and verify patch
        shell: bash
        run: |
          node scripts/check-g119-cross-stream.mjs
          git init "$RUNNER_TEMP/opencode-v2"
          git -C "$RUNNER_TEMP/opencode-v2" fetch --depth=1 https://github.com/anomalyco/opencode.git 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/opencode-v2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/opencode-v2" rev-parse HEAD)" = 4617210822bdbb31e5749751afbfb4584ccedac8
          git -C "$RUNNER_TEMP/opencode-v2" apply --check "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
          git -C "$RUNNER_TEMP/opencode-v2" apply "$GITHUB_WORKSPACE/docs/patches/opencode-v2-4617210-browser-plugin-capability.patch"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install upstream dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ runner.temp }}/opencode-v2
      - name: G106 focused live Core saved-policy revision and BrowserLease/GUI gate tests
        working-directory: ${{ runner.temp }}/opencode-v2
        run: |
          bun run --cwd packages/plugin typecheck
          bun run --cwd packages/plugin-browser typecheck
          bun run --cwd packages/core typecheck
          bun run --cwd packages/gui-extensions typecheck
          (cd packages/core && bun test test/permission.test.ts test/permission-browser-lease.test.ts test/plugin/browser-lease.test.ts test/plugin/browser-capability.test.ts)
          (cd packages/plugin-browser && bun test test/read-commit.test.ts test/connection-location.test.ts)
          (cd packages/gui-extensions && bun test src/browser/read-commit-gate.test.ts)
